startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      S2_API_KEY:
        type: string
        description: Optional Semantic Scholar key for higher limits and snippet search.
      OPENALEX_API_KEY:
        type: string
        description: Optional OpenAlex key for search and citation traversal.
      DASHSCOPE_API_KEY:
        type: string
        description: Optional DashScope key for Qwen reranking.
      DASHSCOPE_HTTP_BASE_URL:
        type: string
        description: Optional Alibaba workspace API host or /api/v1 base URL.
      SCHOLAR_RERANK_MODEL:
        type: string
        description: Optional Alibaba or custom reranker model name.
      SCHOLAR_RERANK_URL:
        type: string
        description: Optional full custom rerank endpoint; overrides Alibaba routing.
      SCHOLAR_RERANK_API_KEY:
        type: string
        description: Optional credential for the custom rerank endpoint only.
      CORE_API_KEY:
        type: string
        description: Optional CORE key for repository search and PDF resolution.
      EXA_API_KEY:
        type: string
        description: Optional Exa key for an additional semantic retrieval channel.
  commandFunction: |-
    (config) => {
      const env = { SCHOLAR_MCP_EXTENSIONS: 'research' };
      for (const key of ['S2_API_KEY', 'OPENALEX_API_KEY', 'DASHSCOPE_API_KEY',
                         'DASHSCOPE_HTTP_BASE_URL', 'SCHOLAR_RERANK_MODEL',
                         'SCHOLAR_RERANK_URL', 'SCHOLAR_RERANK_API_KEY', 'CORE_API_KEY', 'EXA_API_KEY']) {
        if (config[key]) env[key] = config[key];
      }
      return {
        command: 'uvx',
        args: ['--python', '3.12', '--find-links', 'https://github.com/Liyux3/scholar-mcp/releases/download/v0.8.5/wheel-index.html', '--from', 'scholar-mcp[rerank]==0.8.5', 'scholar-mcp'],
        env,
      };
    }
  exampleConfig: {}
