name: Build compatibility wheels

on:
  workflow_dispatch:
    inputs:
      include_windows:
        type: boolean
        default: true
  workflow_call:
    inputs:
      include_windows:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.include_windows && '["macos-15-intel","windows-11-arm"]' || '["macos-15-intel"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      OPENSSL_STATIC: "1"
      CRYPTOGRAPHY_VERSION: "50.0.1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Select Rust toolchain
        run: rustup default stable
      - name: Prepare current OpenSSL on Intel macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Build static OpenSSL on Windows ARM
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP 'scholar-vcpkg'
          git clone --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg.git $vcpkgRoot
          git -C $vcpkgRoot checkout 319504a5326aa870edde46438c5455fa76305a56
          & "$vcpkgRoot/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @('set(VCPKG_TARGET_ARCHITECTURE arm64)',
            'set(VCPKG_CRT_LINKAGE dynamic)',
            'set(VCPKG_LIBRARY_LINKAGE static)') |
            Set-Content "$vcpkgRoot/triplets/community/arm64-windows-static-md.cmake"
          & "$vcpkgRoot/vcpkg.exe" install openssl:arm64-windows-static-md --disable-metrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VCPKGRS_TRIPLET=arm64-windows-static-md" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OPENSSL_DIR=$vcpkgRoot/installed/arm64-windows-static-md" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build upstream cryptography without changing its source
        run: uv run --no-project --with pip python -m pip wheel --no-deps --no-binary cryptography --wheel-dir .compat-wheels cryptography==50.0.1
      - name: Verify native wheel import
        shell: bash
        run: |
          wheel=(.compat-wheels/*.whl)
          uv run --no-project --with "${wheel[0]}" python -c 'import cryptography; from cryptography.hazmat.bindings.openssl.binding import Binding; assert cryptography.__version__ == "50.0.1"; print(cryptography.__version__, Binding.lib.OPENSSL_VERSION_NUMBER)'
      - uses: actions/upload-artifact@v4
        with:
          name: crypto-wheel-${{ matrix.os }}
          path: .compat-wheels/*.whl
