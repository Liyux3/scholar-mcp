name: Source health

# Every free link a search depends on, probed daily from a clean machine: about
# one small request per provider a day, paced like any other. Billed links (Exa,
# a cloud reranker) are never given keys here; real use vouches for them. A
# failed probe opens one issue, or comments on the open one, so a changed or
# broken provider API is fixed before users run into it.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --locked --extra rerank

      - name: Probe
        id: probe
        # Google answers data-centre addresses with a challenge, so CI leaves it out.
        run: uv run scholar-mcp doctor --network --skip google_scholar --json > health.json
        env:
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_EMAIL: ${{ secrets.OPENALEX_EMAIL }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: health
          path: health.json

      - name: Open or update the health issue
        if: failure() && steps.probe.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(python3 - <<'EOF'
          import json
          probe = json.load(open("health.json"))["probe"]
          print("Problems: " + ", ".join(f"{link} ({why})" for link, why in probe["problems"].items()))
          print("\n```json\n" + json.dumps(probe, indent=1)[:60000] + "\n```")
          EOF
          )
          number=$(gh issue list --label source-health --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh label create source-health --force > /dev/null
            gh issue create --title "Source health: a probe failed" --label source-health --body "$body"
          fi
