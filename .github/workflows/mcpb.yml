name: Build MCPB

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to upload to
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.event.release.tag_name || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build bundle
        run: PYTHON=python3.12 bash scripts/build_mcpb.sh
      - name: Smoke bundle
        run: uv run python scripts/smoke_mcpb.py
      - name: Upload to release
        if: github.event_name == 'release' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload \
            "${{ github.event.release.tag_name || inputs.release_tag }}" \
            mcpb-build/*.mcpb --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: scholar-mcpb-${{ matrix.os }}
          path: mcpb-build/*.mcpb
