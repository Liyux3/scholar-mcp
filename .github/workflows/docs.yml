name: Docs

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Publish release"]
    types: [completed]
  push:
    branches: [main, docs/site]
    paths:
      - "site/**"
      # The site renders these directly, so their edits must redeploy it too.
      - "CHANGELOG.md"
      - "docs/assets/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.release.outputs.ready }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the documented installation is available
        id: release
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess, tomllib, urllib.error, urllib.request
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          docs = json.loads(pathlib.Path('site/package.json').read_text()).get('scholarDocs', {})
          preview = docs.get('channel') == 'preview'
          if preview:
              ref = docs.get('sourceRef', '')
              if not re.fullmatch('[0-9a-f]{40}', ref):
                  raise ValueError('Preview documentation must pin an immutable source commit')
              subprocess.run(['git', 'fetch', '--depth=1', 'origin', ref], check=True)
              source = subprocess.check_output(['git', 'show', ref + ':pyproject.toml'], text=True)
              if tomllib.loads(source)['project']['version'] != version:
                  raise ValueError('Preview source and documentation versions differ')
              version = docs['stableVersion']
          try:
              with urllib.request.urlopen(f'https://pypi.org/pypi/scholar-mcp/{version}/json', timeout=20) as response:
                  package = json.load(response)
              ready = package['info']['version'] == version and bool(package['urls'])
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              ready = False
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'ready={str(ready).lower()}\n')
          print(f'Stable package {version}: {"available" if ready else "awaiting release"}; preview={preview}')
          PY
      - uses: withastro/action@v6
        with:
          path: site
          node-version: 22

  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
