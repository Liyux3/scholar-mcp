name: Portable runtime

on:
  workflow_dispatch:
  push:
    branches: [main, codex/scholar-v0.8-release]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  wheels:
    uses: ./.github/workflows/compat-wheels.yml
  native:
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      UV_NO_SYNC: "1"
      UV_FIND_LINKS: ${{ github.workspace }}/.compat-wheels
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: crypto-wheel-*
          path: .compat-wheels
          merge-multiple: true
      - name: Install native runtime and dependencies
        run: |
          uv venv --python 3.12
          uv run --no-project python scripts/runtime_wheels.py --local
          uv export --locked --no-hashes --no-emit-project --extra dev --extra rerank --output-file runtime-requirements.txt
          uv pip install --only-binary cryptography --find-links .compat-wheels --requirement runtime-requirements.txt --editable .
      - name: Record native platform and load binary dependencies
        run: uv run python -c "import platform,sys,onnxruntime,pypdfium2; assert sys.version_info[:2] == (3,12); print(platform.platform(),platform.machine()); print(onnxruntime.get_available_providers())"
      - name: Exercise offline functionality including PDF parsing and rendering
        run: uv run pytest -q
      - name: Build and install candidate in isolation
        run: uv build
      - name: Exercise installed MCP package
        run: uv run python scripts/smoke_release.py
      - name: Exercise POSIX launcher arguments
        if: runner.os != 'Windows'
        run: uv run pytest -q tests/test_portable_launch.py
      - name: Exercise Windows launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist/*.whl | Select-Object -First 1
          $env:SCHOLAR_PACKAGE = "scholar-mcp[rerank] @ " + ([Uri]$wheel.FullName).AbsoluteUri
          $env:SCHOLAR_WHEEL_INDEX = Join-Path $env:GITHUB_WORKSPACE '.compat-wheels'
          & ./scripts/launch.ps1 --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./scripts/launch.cmd --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
