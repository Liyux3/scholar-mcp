name: Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --python "${{ matrix.python-version }}" --extra dev --extra compression --extra rerank

      - name: Verify Python version
        run: uv run python -c 'import sys; assert ".".join(map(str, sys.version_info[:2])) == "${{ matrix.python-version }}"; print(sys.version)'

      - name: Run tests
        run: uv run pytest tests/ -v
        env:
          PYTHONDONTWRITEBYTECODE: 1
